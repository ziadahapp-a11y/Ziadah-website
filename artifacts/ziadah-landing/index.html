    <style>
      /* ── Initial loader (visible before React mounts) ───────────────── */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 28px;
        background:
          radial-gradient(ellipse 70% 55% at 50% 30%, rgba(124, 58, 237, 0.22) 0%, transparent 65%),
          radial-gradient(ellipse 60% 50% at 50% 100%, rgba(34, 211, 238, 0.10) 0%, transparent 60%),
          linear-gradient(160deg, #0e0a22 0%, #080615 45%, #0b0718 100%);
        transition: opacity 0.55s ease, visibility 0.55s ease;
        opacity: 1;
        visibility: visible;
        font-family: "Tajawal", "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .app-mounted #initial-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      html[data-theme="light"] #initial-loader {
        background:
          radial-gradient(ellipse 70% 55% at 50% 30%, rgba(124, 58, 237, 0.10) 0%, transparent 65%),
          linear-gradient(160deg, #faf8ff 0%, #ffffff 45%, #f5f1ff 100%);
      }

      #initial-loader .il-logo {
        position: relative;
        width: 116px;
        height: 116px;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #15102e 0%, #0a0719 100%);
        box-shadow:
          0 30px 80px rgba(124, 58, 237, 0.32),
          0 0 0 1px rgba(255, 255, 255, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        isolation: isolate;
      }
      html[data-theme="light"] #initial-loader .il-logo {
        background: linear-gradient(160deg, #ffffff 0%, #f5f1ff 100%);
        box-shadow:
          0 20px 60px rgba(124, 58, 237, 0.18),
          0 0 0 1px rgba(124, 58, 237, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      #initial-loader .il-logo::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 30px;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(124, 58, 237, 0.0) 40deg,
          rgba(124, 58, 237, 0.85) 120deg,
          rgba(168, 85, 247, 1) 160deg,
          rgba(34, 211, 238, 0.6) 200deg,
          rgba(124, 58, 237, 0.0) 280deg,
          transparent 360deg
        );
        animation: il-spin 1.8s linear infinite;
        z-index: -1;
      }
      #initial-loader .il-logo::after {
        content: "";
        position: absolute;
        inset: 1.5px;
        border-radius: 27px;
        background: inherit;
        z-index: -1;
      }
      #initial-loader .il-logo img {
        width: 58%;
        height: 58%;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(124, 58, 237, 0.55));
        animation: il-pulse 2.4s ease-in-out infinite;
      }

      #initial-loader .il-bar {
        position: relative;
        width: 168px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      html[data-theme="light"] #initial-loader .il-bar {
        background: rgba(124, 58, 237, 0.12);
      }
      #initial-loader .il-bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -42%;
        width: 42%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(168, 85, 247, 0.95) 50%,
          transparent 100%
        );
        animation: il-bar 1.35s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #initial-loader .il-brand {
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-weight: 600;
        color: rgba(245, 242, 238, 0.42);
      }
      html[data-theme="light"] #initial-loader .il-brand {
        color: rgba(76, 29, 149, 0.55);
      }

      @keyframes il-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes il-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.86; }
      }
      @keyframes il-bar {
        0%   { left: -42%; }
        100% { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .il-logo::before,
        #initial-loader .il-logo img,
        #initial-loader .il-bar::after {
          animation: none !important;
        }
        #initial-loader .il-bar::after {
          left: 0;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>

      </div>
      <div class="il-bar"></div>
      <div class="il-brand">ZIADAH</div>
    </div>
