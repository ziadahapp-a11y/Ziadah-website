kind = "web"
previewPath = "/"
title = "زيادة - تطبيق الذكاء الاصطناعي"
version = "1.0.0"
id = "artifacts/ziadah-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24794
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/ziadah-landing run dev"

[services.env]
PORT = "24794"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/ziadah-landing", "run", "build"]
publicDir = "artifacts/ziadah-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
