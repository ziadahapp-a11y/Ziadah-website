kind = "web"
previewPath = "/"
title = "Ziadah Product Intelligence Engine"
version = "1.0.0"
id = "artifacts/ziadah-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24215

[services.development]
run = "pnpm --filter @workspace/ziadah-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ziadah-engine", "run", "build" ]
publicDir = "artifacts/ziadah-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24215"
BASE_PATH = "/"
